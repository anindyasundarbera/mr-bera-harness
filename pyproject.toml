[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-bera-harness"
# Single-sourced from the code. The version used to be written here *and* in
# `src/harness/__init__.py`, so the two could disagree — and a package that
# reports a version other than the one it was built from is worse than one that
# reports none. The code is the source because it is what a running harness can
# report about itself; `--version` and the dashboard provenance both read it.
dynamic = ["version"]
description = "Deterministic session harness: the LLM proposes, the harness disposes"
readme = "README.md"
# tomllib is stdlib from 3.11. The harness is new and has no 3.10 consumers, so
# the floor is raised rather than adding `tomli` as a dependency.
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Proposals are validated against JSON Schema (architecture section 10.1). The
# standard implementation, not a hand-rolled subset: a second definition of
# validity would be a subtly different contract.
propose = ["jsonschema>=4.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned: an unpinned linter lets local and CI disagree on the same file,
    # which makes a green local run meaningless as evidence.
    "ruff==0.16.1",
    "mypy>=1.10",
    "types-PyYAML",
]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
# Read the version from the package itself, so there is exactly one place to
# change it and no way for the two to drift.
version = { attr = "harness.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/harness"]
omit = ["tests/*"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml.*", "psycopg.*", "jsonschema.*"]
ignore_missing_imports = true
